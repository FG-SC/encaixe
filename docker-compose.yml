# Encaixe in production: the app (API + front + SQLite on a volume) behind Caddy, which serves HTTPS automatically.
# Configure .env.prod first (copy deploy/env.prod.example). Setup, cron jobs, backups and updates: docs/DEPLOY.md.
services:
  app:
    build: .
    image: encaixe:latest
    env_file: .env.prod
    volumes:
      - encaixe-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    env_file: .env.prod # DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  encaixe-data:
  caddy-data:
  caddy-config:
