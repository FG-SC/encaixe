# ===================== seniority =====================
# Title-only (job title, experience role). Folded, case-insensitive tokens with word boundaries;
# case_sensitive_tokens (roman numerals) only as the last title token or before " - ", "(", "|", ",".
seniority:
  levels:
    - {level: 1, id: intern, label_pt: Estágio, label_en: Intern, tokens: [estagio, estagiario, estagiaria, estagiarios, intern, interns, internship, aprendiz, jovem aprendiz, apprentice, bolsista]}
    - {level: 2, id: junior, label_pt: Júnior, label_en: Junior, tokens: [junior, jr, trainee, entry level, entry-level, recem-formado, recem formado, graduate program], case_sensitive_tokens: [I]}
    - {level: 3, id: mid, label_pt: Pleno, label_en: Mid-level, tokens: [pleno, plena, pl, mid, mid-level, mid level], case_sensitive_tokens: [II]}
    - {level: 4, id: senior, label_pt: Sênior, label_en: Senior, tokens: [senior, sr], case_sensitive_tokens: [III]}
    - {level: 5, id: staff, label_pt: Staff / Especialista / Lead, label_en: Staff / Lead, tokens: [staff, especialista, lead, tech lead, technical lead, lider tecnico, lider tecnica, team lead, lider], case_sensitive_tokens: [IV]}
    - {level: 6, id: principal, label_pt: Principal, label_en: Principal, tokens: [principal, distinguished, fellow]}
  # Weak tokens: used only when the title has no explicit level token above.
  role_tokens:
    - {level: 2, tokens: [assistente, auxiliar]}
    - {level: 3, tokens: [supervisor, supervisora]}
    - {level: 4, tokens: [coordenador, coordenadora, coordinator, gerente, manager]}
    - {level: 5, tokens: [head]}
    - {level: 6, tokens: [diretor, diretora, director, vp, vice-presidente, vice president, chief, cto, cdo, cio, ceo]}
  # "manager/gerente" inside these role nouns is the job name, not a level: no level from them.
  no_level_role_nouns: [product manager, gerente de produto, gerente de produtos, project manager, gerente de projetos, gerente de projeto, program manager, account manager, gerente de contas, key account manager, customer success manager, community manager, product owner, scrum master]
  # Never a level signal on their own (fall back to years of experience).
  no_level_tokens: [associate, specialist, consultant, consultor, consultora, analista, analyst, engenheiro, engenheira, engineer, developer, desenvolvedor, desenvolvedora, cientista, scientist, expert]
  blockers: [pl/sql, lead generation, geracao de leads, lead scoring, head hunter, staff augmentation, senior sistemas]
  rules:
    - Explicit level tokens win over role_tokens; role_tokens apply only when no explicit token is present.
    - Several explicit levels in one title (Jr/Pl, Pleno a Senior, Mid-Senior) -> the lowest one.
    - No token at all -> years-of-experience fallback (BUILD_PLAN decision 9).
