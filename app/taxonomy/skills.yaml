# ===================== languages =====================
# A language is detected when an alias co-occurs with a level word within 4 tokens (either side) or sits in an
# "Idiomas/Languages" section. Several level words -> highest. No level word -> level null.
language_level_order: [basic, intermediate, advanced, fluent, native]
languages:
  - id: english
    label: Inglês
    label_en: English
    aliases: [ingles, english, lingua inglesa]
    level_words: &level_words
      native: [nativo, nativa, lingua materna, idioma nativo, native, native speaker, mother tongue, bilingue, bilingual]
      fluent: [fluente, fluencia, fluent, fluency, c2, full professional proficiency]
      advanced: [avancado, avancada, advanced, proficiente, proficiencia, proficient, proficiency, c1, professional working proficiency]
      intermediate: [intermediario, intermediaria, intermediate, upper intermediate, upper-intermediate, b1, b2, conversacao, conversacional, conversational, limited working proficiency]
      basic: [basico, basica, basic, elementary, iniciante, beginner, a1, a2, instrumental, tecnico, leitura, reading, elementary proficiency]
  - {id: spanish, label: Espanhol, label_en: Spanish, aliases: [espanhol, spanish, espanol, castelhano, lingua espanhola], level_words: *level_words}
  - {id: portuguese, label: Português, label_en: Portuguese, aliases: [portugues, portuguese, lingua portuguesa], level_words: *level_words}
  - {id: french, label: Francês, label_en: French, aliases: [frances, french, francais, lingua francesa], level_words: *level_words}
  - {id: german, label: Alemão, label_en: German, aliases: [alemao, german, deutsch, lingua alema], level_words: *level_words}
  - {id: italian, label: Italiano, label_en: Italian, aliases: [italiano, italian, lingua italiana], level_words: *level_words}
